services:
  - type: web
    name: techsave-api
    runtime: docker
    plan: free
    healthCheckPath: /api/info
    envVars:
      - key: PORT
        value: "10000"
      - key: CORS_ORIGIN
        value: https://techsave-techgpt.web.app
      - key: RATE_MAX
        value: "20"
      - key: UPSTREAM_COBALT
        value: https://techsave-cobalt.onrender.com/

  - type: web
    name: techsave-cobalt
    runtime: image
    image:
      url: ghcr.io/imputnet/cobalt:11
    plan: free
    healthCheckPath: /
    envVars:
      - key: API_URL
        value: https://techsave-cobalt.onrender.com/
      - key: API_PORT
        value: "10000"
      - key: PORT
        value: "10000"
